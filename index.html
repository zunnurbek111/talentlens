<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TalentLens – AI Recruitment Demo</title>
<style>
:root{color-scheme:light dark;--bg:#f5f6fa;--card:#ffffff;--tx:#2a3144;--mut:#6b7489;--bd:#e5e8f0;--pri:#5b6cf0;--prib:#eceefe;--ok:#16a34a;--okb:#e7f7ec;--warn:#d97706;--warnb:#fdf3e0;--bad:#dc2626;--badb:#fdeaea;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#181b26;--card:#212536;--tx:#d8dbe8;--mut:#98a0b8;--bd:#2f3550;--pri:#8f9dff;--prib:#2b3150;--ok:#74d6a0;--warn:#e9bd6e;--bad:#f09c9c;--okb:#22392f;--warnb:#3a3324;--badb:#3d2a33}}
*{box-sizing:border-box}html,body{margin:0}body{font:15px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;background:var(--bg);color:var(--tx)}
#app{display:flex;min-height:100vh}
nav{width:210px;flex:none;background:var(--card);border-right:1px solid var(--bd);padding:16px 10px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:2px}
nav h1{font-size:17px;margin:0 8px 14px;color:var(--pri)}
nav button{all:unset;cursor:pointer;padding:10px 14px;border-radius:10px;color:var(--mut);font-weight:500}
nav button.on,nav button:hover{background:var(--prib);color:var(--pri)}
nav .sp{flex:1}nav .lg{margin:4px 8px;padding:5px}
main{flex:1;min-width:0;padding:22px;max-width:1200px}
h2{margin:0 0 4px;font-size:20px;font-weight:600}.sub{color:var(--mut);margin:0 0 18px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px 16px;margin-bottom:10px;box-shadow:0 1px 3px #0000000d}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.stat b{display:block;font-size:24px;font-weight:600}.stat span{color:var(--mut)}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
input,select,textarea{font:inherit;color:var(--tx);background-color:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:9px 12px;max-width:100%}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--pri);box-shadow:0 0 0 3px var(--prib)}
select{appearance:none;-webkit-appearance:none;cursor:pointer;padding-right:32px;background-repeat:no-repeat;background-position:right 11px center;background-image:url('data:image/svg+xml;utf8,<svg xmlns=%27http://www.w3.org/2000/svg%27 width=%2712%27 height=%2712%27 viewBox=%270 0 12 12%27><path d=%27M2 4l4 4 4-4%27 fill=%27none%27 stroke=%27%23999%27 stroke-width=%271.6%27 stroke-linecap=%27round%27/></svg>')}
option{background:var(--card);color:var(--tx)}option:checked{background:var(--prib)}
textarea{width:100%;min-height:90px}label{display:block;font-weight:600;margin:10px 0 3px;font-size:13px}
.f input,.f select{width:100%}
.btn{cursor:pointer;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;padding:8px 14px;font:inherit;font-weight:500;transition:background .15s,filter .15s}.btn:hover{background:var(--prib)}.btn.p:hover{filter:brightness(1.1)}
.btn.p{background:var(--pri);color:var(--bg);border-color:var(--pri)}.btn.d{color:var(--bad)}.btn.s{padding:4px 9px;font-size:12px}
.chip{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;margin:2px 3px 2px 0;background:var(--prib);color:var(--mut)}
.chip.ok{background:var(--okb);color:var(--ok)}.chip.warn{background:var(--warnb);color:var(--warn)}.chip.bad{background:var(--badb);color:var(--bad)}.chip.g{background:var(--bd);color:var(--mut)}
.row{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap}.mut{color:var(--mut)}
.two{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.ring{--p:0;--c:var(--ok);width:110px;height:110px;border-radius:50%;background:conic-gradient(var(--c) calc(var(--p)*1%),var(--bd) 0);display:grid;place-items:center;flex:none}
.ring i{font-style:normal;width:84px;height:84px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-size:24px;font-weight:700}
.ai{border-left:3px solid var(--pri);background:var(--prib);border-radius:12px;padding:14px 16px;margin-top:12px}
.ai h3{margin:0 0 6px;font-size:15px}.ai h4{margin:12px 0 4px}.ai ul{margin:0;padding-left:20px}
.tag{font-size:10px;border:1px solid var(--bd);color:var(--mut);border-radius:4px;padding:1px 6px;vertical-align:middle;font-weight:500}
.kan{display:grid;grid-template-columns:repeat(6,minmax(190px,1fr));gap:10px;overflow-x:auto;padding-bottom:8px}
.col{background:var(--prib);border-radius:14px;padding:10px;min-height:260px}
.col.over{outline:2px dashed var(--pri)}.col h4{margin:0 0 8px;display:flex;justify-content:space-between}
.k{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:9px;margin-bottom:8px;cursor:grab}
.k select{width:100%;margin-top:6px;padding:4px;font-size:12px}
.hb{display:flex;align-items:center;gap:8px;margin:5px 0}.hb span:first-child{width:110px;flex:none;font-size:13px}
.hb div{height:6px;border-radius:3px;background:var(--pri);min-width:3px}
#fab{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:6;display:flex;flex-direction:column;align-items:flex-end;gap:8px}#fm{display:flex;flex-direction:column;gap:6px}#fm[hidden]{display:none}#fb{width:48px;height:48px;border-radius:50%;border:0;background:var(--pri);color:var(--bg);font-size:26px;cursor:pointer;box-shadow:0 4px 14px #0003}
#modal{position:fixed;inset:0;background:#0009;display:none;place-items:center;padding:14px;z-index:9;overflow:auto}
#modal.on{display:grid}#modal>div{background:var(--card);border-radius:14px;padding:20px;width:min(560px,100%);max-height:92vh;overflow:auto}
@media(max-width:800px){#app{flex-direction:column}nav{width:100%;height:auto;position:sticky;top:0;z-index:5;flex-direction:row;overflow-x:auto;padding:8px;border-right:0;border-bottom:1px solid var(--bd)}nav h1,nav .sp{display:none}nav button{white-space:nowrap}main{padding:14px}}
</style></head>
<body><div id="app">
<nav id="nav"></nav><main id="main"></main></div><div id="fab"><div id="fm" hidden><button class="btn p" onclick="jobForm();fab()">+ Create New Job</button><button class="btn p" onclick="candForm();fab()">+ Add Candidate</button></div><button id="fb" onclick="fab()" aria-label="Add">+</button></div><div id="modal" onclick="if(event.target===this)closeM()"><div id="mbox"></div></div>
<script>
/* ===== TalentLens demo: vanilla JS, state persisted in localStorage ===== */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const STAGES=['Applied','Screening','Interview','Offer','Hired','Rejected'];
const KNOWN=['JavaScript','TypeScript','React','Vue','Angular','Node.js','CSS','HTML','Testing','GraphQL','Accessibility','Redux','Python','SQL','Excel','Tableau','Statistics','Pandas','Figma','Prototyping','User Research','Design Systems','Java','Docker','AWS','Git','Agile','Leadership','Communication'];
const KEY='talentlens.v2';
const uid=()=>Math.random().toString(36).slice(2,9);
const pl=s=>String(s).split(/[,\n]/).map(x=>x.trim()).filter(Boolean);
const ago=t=>new Date(t).toLocaleString([], {month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});

function seed(){return{
 jobs:[
  {id:'j1',title:'Senior Frontend Developer',dept:'Engineering',skills:['React','TypeScript','CSS','Testing','Accessibility','GraphQL'],desc:'Own the web app UI, mentor juniors, and drive quality.',status:'open'},
  {id:'j2',title:'Data Analyst',dept:'Analytics',skills:['SQL','Python','Tableau','Statistics','Excel'],desc:'Turn product data into decisions.',status:'open'},
  {id:'j3',title:'Product Designer',dept:'Design',skills:['Figma','User Research','Prototyping','Design Systems'],desc:'Design end-to-end product experiences.',status:'closed'},
  {id:'j4',title:'Backend Engineer',dept:'Engineering',skills:['Node.js','SQL','Docker','AWS','Git'],desc:'Build and scale APIs and services.',status:'open'},
  {id:'j5',title:'Full-Stack Developer',dept:'Engineering',skills:['React','Node.js','SQL','TypeScript','Git'],desc:'Ship features across the whole stack.',status:'open'},
  {id:'j6',title:'DevOps Engineer',dept:'Infrastructure',skills:['Docker','AWS','Git','Python'],desc:'Automate CI/CD and cloud infrastructure.',status:'open'},
  {id:'j7',title:'QA Engineer',dept:'Quality',skills:['Testing','JavaScript','Agile','Communication'],desc:'Own test strategy and automation.',status:'open'},
  {id:'j8',title:'Vue Developer',dept:'Engineering',skills:['Vue','JavaScript','CSS','HTML'],desc:'Build components for our Vue storefront.',status:'open'},
  {id:'j9',title:'Engineering Manager',dept:'Engineering',skills:['Leadership','Agile','Communication','Java'],desc:'Lead a team of 8 engineers.',status:'open'},
  {id:'j10',title:'Data Scientist',dept:'Analytics',skills:['Python','Pandas','Statistics','SQL'],desc:'Build predictive models for growth.',status:'open'},
  {id:'j11',title:'UX Researcher',dept:'Design',skills:['User Research','Figma','Communication'],desc:'Run studies and share insights.',status:'closed'},
  {id:'j12',title:'Product Manager',dept:'Product',skills:['Agile','Communication','Leadership','Excel'],desc:'Define roadmap and priorities.',status:'open'},
  {id:'j13',title:'Junior Frontend Developer',dept:'Engineering',skills:['HTML','CSS','JavaScript','Git'],desc:'Entry-level role with mentorship.',status:'open'}],
 cands:[
  {id:'c1',name:'Aisha Karimova',email:'aisha@example.com',exp:6,skills:['React','TypeScript','CSS','Testing','Redux'],resume:'6 years building React and TypeScript apps. Led migration to Jest/Cypress testing. Improved page speed 40%.',stage:'Interview',jobId:'j1'},
  {id:'c2',name:'Bobur Tashkentov',email:'bobur@example.com',exp:3,skills:['JavaScript','React','HTML','CSS'],resume:'3 years JavaScript. Built dashboards in React. Cares about accessibility and clean UI.',stage:'Applied',jobId:'j1'},
  {id:'c3',name:'Dilnoza Rashidova',email:'dilnoza@example.com',exp:4,skills:['SQL','Python','Excel','Tableau'],resume:'4 years analytics. Dashboards in Tableau, ETL in Python and SQL.',stage:'Screening',jobId:'j2'},
  {id:'c4',name:'Eric Johnson',email:'eric@example.com',exp:8,skills:['Figma','Prototyping','User Research','Design Systems'],resume:'8 years product design; built a design system used by 12 teams.',stage:'Offer',jobId:'j3'},
  {id:'c5',name:'Farhod Aliyev',email:'farhod@example.com',exp:2,skills:['Python','Pandas','Statistics'],resume:'2 years data science. Pandas, statistics, A/B testing.',stage:'Applied',jobId:'j2'},
  {id:'c6',name:'Gulnora Yusupova',email:'gulnora@example.com',exp:5,skills:['Node.js','SQL','Docker','Git'],resume:'5 years backend. Node.js APIs, SQL tuning, deployed on AWS with Docker.',stage:'Screening',jobId:'j4'},
  {id:'c7',name:'Timur Sadikov',email:'timur@example.com',exp:1,skills:['HTML','CSS','JavaScript'],resume:'Junior developer, 1 year. Landing pages, JavaScript, Git basics.',stage:'Applied',jobId:'j13'},
  {id:'c8',name:'Nodira Hamidova',email:'nodira@example.com',exp:7,skills:['Leadership','Agile','Communication'],resume:'7 years leading teams. Agile coach, ex-Java developer.',stage:'Interview',jobId:'j9'}],
 log:[{t:Date.now(),m:'Demo data loaded'}]}}
let S;try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S||!S.jobs)S=seed();
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const log=m=>{S.log.unshift({t:Date.now(),m});S.log=S.log.slice(0,30);save()};
const J=id=>S.jobs.find(j=>j.id===id), C=id=>S.cands.find(c=>c.id===id);
let view='dashboard', ui={jq:'',js:'all',cq:'',cs:'all',ck:'',ce:0,mj:'',mc:'',ran:false};

/* ===== Matching engine: confirmed skill = 1pt, résumé-only mention = 0.5pt ===== */
function rx(k){return new RegExp('(?<![a-z0-9])'+k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'(?![a-z0-9])','i')}
function extract(text){return KNOWN.filter(k=>rx(k).test(text))}
function match(job,c){
 const have=c.skills.map(s=>s.toLowerCase()),m=[],u=[],x=[];
 job.skills.forEach(r=>have.includes(r.toLowerCase())?m.push(r):rx(r).test(c.resume||'')?u.push(r):x.push(r));
 const n=job.skills.length||1;
 return{m,u,x,score:Math.round((m.length+u.length*.5)/n*100)};
}
const tone=s=>s>=75?'ok':s>=50?'warn':'bad';

/* ===== Demo "AI": rule-based generator (no external API) ===== */
function aiReportEN(job,c,r){
 const verdict=r.score>=75?'a strong fit':r.score>=50?'a partial fit':'a weak fit';
 const why=[`${esc(c.name)} is <b>${verdict}</b> for ${esc(job.title)} (${r.score}% match).`,
  `Confirmed ${r.m.length} of ${job.skills.length} required skills${r.m.length?': '+r.m.map(esc).join(', '):''}.`,
  `${c.exp} year${c.exp==1?'':'s'} of experience on record.`];
 if(r.u.length)why.push(`Résumé mentions <b>${r.u.map(esc).join(', ')}</b> but they are not in the skills list – worth verifying.`);
 const gaps=[...r.x.map(s=>`<b>${esc(s)}</b> – not found anywhere in the résumé (critical gap).`),
  ...r.u.map(s=>`<b>${esc(s)}</b> – only implied in résumé text (unconfirmed).`)];
 const tech=[...r.x.map(s=>`The role requires ${esc(s)}. How would you get productive in it in your first 30 days?`),
  ...r.u.map(s=>`Your résumé hints at ${esc(s)}. Walk us through a concrete project where you used it.`),
  ...r.m.slice(0,2).map(s=>`Describe a production problem you solved with ${esc(s)} and the trade-offs you made.`)];
 const beh=['Tell me about a time you learned a new tool quickly under a deadline.',
  'Describe a technical disagreement with a teammate and how you resolved it.',
  `Why ${esc(job.title)}, and why now?`];
 return`<div class="ai"><h3>AI Assistant <span class="tag">Demo Prototype AI</span></h3>
 <h4>Skills match explanation</h4><ul>${why.map(w=>`<li>${w}</li>`).join('')}</ul>
 <h4>Skill gaps / unconfirmed skills</h4>${gaps.length?`<ul>${gaps.map(g=>`<li>${g}</li>`).join('')}</ul>`:'<p class="mut">No gaps – all requirements confirmed.</p>'}
 <h4>Suggested interview questions</h4><b>Technical</b><ul>${tech.map(q=>`<li>${q}</li>`).join('')}</ul>
 <b>Behavioral</b><ul>${beh.map(q=>`<li>${q}</li>`).join('')}</ul>
 <p class="mut" style="font-size:12px;margin:10px 0 0">Rule-based demo output – not a real hiring decision.</p></div>`;
}

/* ===== Helpers ===== */
const chips=(a,c='')=>a.map(s=>`<span class="chip ${c}">${esc(s)}</span>`).join('');
const stageOpts=cur=>STAGES.map(s=>`<option value="${s}" ${s===cur?'selected':''}>${s}</option>`).join('');
function moveStage(id,st){const c=C(id);if(!c||c.stage===st)return;const old=c.stage;c.stage=st;log(`${c.name}: ${old} → ${st}`);render()}
function openM(h){$('#mbox').innerHTML=h;$('#modal').classList.add('on')}
function closeM(){$('#modal').classList.remove('on')}
function fab(){$('#fm').hidden=!$('#fm').hidden}
function go(v){view=v;render();scrollTo(0,0)}
function goMatch(j,c){if(j)ui.mj=j;if(c)ui.mc=c;ui.ran=false;go('matching')}
function resetDemo(){ask('Reset all data to the demo set?',()=>{S=seed();save();render()},'Reset demo data')}

/* ===== Jobs ===== */
function jobList(){
 const q=ui.jq.toLowerCase();
 const l=S.jobs.filter(j=>(ui.js==='all'||j.status===ui.js)&&(j.title+j.dept+j.skills.join(' ')).toLowerCase().includes(q));
 return l.map(j=>`<div class="card"><div class="row"><div><b style="font-size:16px">${esc(j.title)}</b>
 <span class="chip ${j.status==='open'?'ok':'g'}">${j.status}</span><div class="mut">${esc(j.dept)} · ${S.cands.filter(c=>c.jobId===j.id).length} candidates</div></div>
 <div><button class="btn s p" onclick="goMatch('${j.id}')">Match</button> <button class="btn s" onclick="jobForm('${j.id}')">Edit</button> <button class="btn s" onclick="toggleJob('${j.id}')">${j.status==='open'?'Close':'Reopen'}</button> <button class="btn s d" onclick="delJob('${j.id}')">Delete</button></div></div>
 <p>${esc(j.desc)}</p>${chips(j.skills)}</div>`).join('')||'<p class="mut">No jobs match.</p>';
}
function jobForm(id){const e=J(id)||{};openM(`<h2>${id?'Edit Job':'Create New Job'}</h2><div class="f"><label>Title</label><input id="jt" value="${esc(e.title)}" placeholder="Senior Frontend Developer">
 <label>Department</label><input id="jd" value="${esc(e.dept)}" placeholder="Engineering"><label>Requirements / skills (comma-separated)</label><input id="js" value="${esc((e.skills||[]).join(', '))}" placeholder="React, TypeScript, CSS">
 <label>Description</label><textarea id="jx">${esc(e.desc)}</textarea></div><div class="bar" style="margin-top:14px"><button class="btn p" onclick="addJob('${id||''}')">${id?'Save':'Create job'}</button><button class="btn" onclick="closeM()">Cancel</button></div>`)}
function addJob(id){const t=$('#jt').value.trim(),s=pl($('#js').value);if(!t||!s.length)return alert('Title and at least one skill are required.');
 const d={title:t,dept:$('#jd').value.trim()||'General',skills:s,desc:$('#jx').value.trim()},o=J(id);
 if(o){Object.assign(o,d);log(`Job updated: ${t}`)}else{const j={id:uid(),...d,status:'open'};S.jobs.unshift(j);ui.mj=j.id;log(`Job created: ${t}`)}
 closeM();render()}
function toggleJob(id){const j=J(id);j.status=j.status==='open'?'closed':'open';log(`${j.title} marked ${j.status}`);render()}
function delJob(id){ask('Delete this job?',()=>{S.jobs=S.jobs.filter(j=>j.id!==id);S.cands.forEach(c=>{if(c.jobId===id)c.jobId=''});save();render()},'Delete')}

/* ===== Candidates ===== */
function candList(){
 const q=ui.cq.toLowerCase(),k=ui.ck.toLowerCase();
 const l=S.cands.filter(c=>(ui.cs==='all'||c.stage===ui.cs)&&c.exp>=ui.ce&&(c.name+c.email).toLowerCase().includes(q)&&(!k||c.skills.join(' ').toLowerCase().includes(k)));
 return l.map(c=>`<div class="card"><div class="row"><div><b style="font-size:16px">${esc(c.name)}</b> <span class="chip">${c.stage}</span>
 <div class="mut">${esc(c.email)} · ${c.exp} yrs${c.jobId&&J(c.jobId)?' · for '+esc(J(c.jobId).title):''}</div></div>
 <div><button class="btn s p" onclick="goMatch('${c.jobId||''}','${c.id}')">Match</button> <button class="btn s" onclick="candForm('${c.id}')">Edit</button> <button class="btn s d" onclick="delCand('${c.id}')">Delete</button></div></div>
 <p class="mut" style="margin:6px 0">${esc((c.resume||'').slice(0,160))}</p>${chips(c.skills,'g')}</div>`).join('')||'<p class="mut">No candidates match.</p>';
}
function candForm(id,stage){const e=C(id)||{};openM(`<h2>${id?'Edit Candidate':'Add Candidate'}</h2><div class="f"><label>Name</label><input id="cn" value="${esc(e.name)}"><label>Email</label><input id="ce" type="email" value="${esc(e.email)}">
 <label>Years of experience</label><input id="cx" type="number" min="0" value="${e.exp??3}"><label>Applying for</label><select id="cj"><option value="">— none —</option>${S.jobs.map(j=>`<option value="${j.id}" ${j.id===(id?e.jobId:ui.mj)?'selected':''}>${esc(j.title)}</option>`).join('')}</select>
 <label>Résumé text <span class="mut">(or simulate upload)</span></label><input type="file" id="cf" accept=".txt,.pdf,.doc,.docx" onchange="simUpload(this)"><textarea id="cr" placeholder="Paste résumé text…">${esc(e.resume)}</textarea>
 <label>Skills (comma-separated)</label><input id="ck2" value="${esc((e.skills||[]).join(', '))}" placeholder="React, TypeScript"><button class="btn s" style="margin-top:6px" onclick="$('#ck2').value=extract($('#cr').value).join(', ')">Extract skills from résumé</button></div>
 <div class="bar" style="margin-top:14px"><button class="btn p" onclick="addCand('${id||''}','${stage||'Applied'}')">${id?'Save':'Add candidate'}</button><button class="btn" onclick="closeM()">Cancel</button></div>`)}
function simUpload(el){const f=el.files[0];if(!f)return;
 if(/\.txt$/i.test(f.name)){const r=new FileReader();r.onload=()=>{$('#cr').value=r.result};r.readAsText(f)}
 else $('#cr').value=`[Simulated parse of ${f.name}] Experienced professional with React, TypeScript, CSS and Testing background.`}
function addCand(id,stage){const n=$('#cn').value.trim();if(!n)return alert('Name is required.');
 const resume=$('#cr').value;let sk=pl($('#ck2').value);if(!sk.length)sk=extract(resume);
 const d={name:n,email:$('#ce').value.trim(),exp:+$('#cx').value||0,skills:sk,resume,jobId:$('#cj').value},o=C(id);
 if(o){Object.assign(o,d);log(`Candidate updated: ${n}`)}else{const c={id:uid(),...d,stage:stage||'Applied'};S.cands.unshift(c);ui.mc=c.id;log(`Candidate added: ${n}`)}
 closeM();render()}
function delCand(id){ask('Delete this candidate?',()=>{S.cands=S.cands.filter(c=>c.id!==id);save();render()},'Delete')}

/* ===== Views ===== */
const V={
dashboard(){
 const act=S.cands.filter(c=>!['Hired','Rejected'].includes(c.stage)).length;
 const sc=S.cands.filter(c=>J(c.jobId)).map(c=>match(J(c.jobId),c).score);
 const avg=sc.length?Math.round(sc.reduce((a,b)=>a+b,0)/sc.length)+'%':'—';
 const st=(b,l)=>`<div class="card stat"><b>${b}</b><span>${l}</span></div>`;
 return`<h2>Dashboard</h2><p class="sub">Recruitment overview</p><div class="grid">${st(S.jobs.length+' <small class="mut">('+S.jobs.filter(j=>j.status==='open').length+' open)</small>','Total jobs')}${st(act,'Active candidates')}${st(S.cands.filter(c=>c.stage==='Hired').length,'Hired')}${st(avg,'Average match score')}</div>
